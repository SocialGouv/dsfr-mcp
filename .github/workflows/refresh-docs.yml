name: Refresh DSFR docs

on:
  schedule:
    # Every day at 03:17 UTC
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm fetch-docs

      - name: Commit if docs changed
        run: |
          # meta.json carries a fetch timestamp, so it differs on every run.
          # Committing on that alone would push an empty refresh every night.
          if [ -z "$(git status --porcelain docs/ | grep -v ' docs/meta.json$')" ]; then
            echo "No documentation changes."
            git checkout -- docs/meta.json 2>/dev/null || true
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          git commit -m "chore: refresh DSFR docs"
          git push
